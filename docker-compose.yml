services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
      POSTGRES_DB: ops
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d ops"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    environment: &backend-env
      DATABASE_URL: postgres://ops:ops@db:5432/ops
      TEST_DATABASE_URL: postgres://ops:ops@db:5432/ops_test
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
      PORT: "3000"
    depends_on:
      db: { condition: service_healthy }
    ports: ["3000:3000"]
    # migrate -> seed (only if the DB is empty) -> start
    command: sh -c "npm run migrate && npm run seed -- --if-empty && npm start"

  worker:
    build: ./backend
    environment: *backend-env
    depends_on:
      db: { condition: service_healthy }
    restart: unless-stopped
    command: sh -c "npm run migrate && npm run worker"

  web:
    build: ./frontend
    environment:
      VITE_API_TARGET: http://api:3000
    depends_on: [api]
    ports: ["5173:5173"]

volumes:
  pgdata:
